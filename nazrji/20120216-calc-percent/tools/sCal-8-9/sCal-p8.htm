<SCRIPT LANGUAGE="JavaScript">

// Version configured for Pocket PC 2003 -- r.mohaupt, April, 2004

var ps = "";  // ps is a temp. for 3 alert boxes below: - READ -
function About_sCal() { 
  ps= "sCal - Small, Scientific, Script Calculator v.0.8p ";
 ps+= "for Pocket PC 2003 & higher\n";
 ps+= "**  Free, Public Domain, accessable JavaScript code. ";
 ps+= "**  User must inspect code and test known values \n";
 ps+= "before critical use.  - - NO WARRANTEES. - -\n";
 ps+= "**  R.Mohaupt: Apr, 2004 - mgineer1@netscape.net \n";
 ps+= "**  'Script' & 'Calculator' links produce alert boxes ";
 ps+= "similar to this--like 'Quick Reference Cards'. 'Help' ";
 ps+= "links to sCal8-Doc.htm file, if in same directory.";
 alert(ps); }

function About_Script() {
  ps= "sCal is written in JavaScript (JS) & HTML.  This makes ";
 ps+= "it accessable for easy user modification & addition ";
 ps+= "of functions (JScrAps) to the Select Menus, entering ";
 ps+= "code directly to x-display, or Cut/Paste to it using ";
 ps+= "any text editor--no need of a compiler. \n" 
 ps+= "**  Code in x-display is sent to eval(x) function.  User ";
 ps+= "should review source code (especially sCal2) examples.\n";
 ps+= "**  Compact display and file size are goals of sCal. \n";
 alert(ps); }

function About_Calc() {
  ps= "Simple Calculator operated by buttons or keyboard; ";
 ps+= "expression to x-display.  Drop-down Select menus ";
 ps+= "for more functions.  [Do] operates immediately, ";
 ps+= "[JS] moves to x. /*Comments*/ assist data entry. ";
 ps+= "Click [=] to evaluate.\n ";
 ps+= "**  Only one-[x^] power allowed, Math.pow(x,y) is preferred JavaScript.\n";
 ps+= "[x>m][m>x][m+][mc] for memory; with stopwatch ";
 ps+= "[stop][lap][pause/go][clr]\n";
 ps+= "**  EXPERIMENT --not randomly, but with a point. ";
 alert(ps); }

var x = "";  // by Javascript loose typing, 'x' is a string, AND/OR number: confuses '+' if adding
var m = "";  // stores Memory.  Note: x & m are GLOBAL--of concern if sCal embedded.
var xRedo=0; // restores current x
var Timer=0; var st0p=0; // for stopwatch
var TAPE=""; // virtual adding machine tape
var NL="\n";
//var Nre=/\n/g;
var sp_x=" ";
//
function Ix() { var s = document.sCal.IOx.value;  var n = s.indexOf('/*=');
  if (n>0) {var InPrompt=s.substring(0,n); var xCode=s.substring(n);
         x=InPrompt.replace(sp_x+/\n/g,";") +xCode}
   else {x=s}  // These functions update the x-value for any keyboard inputs, & put any x calculated
 }             // into the x-display.  If the JScrAp is a simple function, the Oxf() is used; else
               // '/*=' shows its a program. 'New Lines' are unset and set for distinct input prompt.
function Oxf() {document.sCal.IOx.value = x}
function Ox() { var n = x.indexOf('/*=');
  if (n>0) {var InPrompt=x.substring(0,n); var xCode=x.substring(n);
         document.sCal.IOx.value = InPrompt.replace(/;/g,sp_x+"\n") +xCode}
   else {document.sCal.IOx.value = x }
 }
function Mr(val,place) {var d=Math.pow(10,place); // set output decimal places
 return Math.round(d*val)/d}

function xEval() {Ix();    // JavaScript eval allows multi-statements, see examples.
 xTemp=x;
 var n = x.indexOf('^');
 if (n > 0) {
  if (x.indexOf('^',n+1) > 0) {alert("WARNING! Only 1 [^] allowed in expression!");}
  else {  // all to left of '^' is taken as base, and all right as exponent
  document.sCal.IOx.value = Math.pow(eval(x.substring(0,n)),eval(x.substring(n+1)));}
  }       // likewise, entire x-value used as function argument, not just last term
 else {document.sCal.IOx.value = eval(x);}
 if (xRedo==1) {x=xTemp; Ox(); Om(); xRedo=0;}
 Ix(); }

function xPlusEq(s) {Ix(); x += s; Ox();} // --- DISPLAY-x functions ---
function xMultEq(s) {xEval(); x *= s; Ox();}
function Clear() {x = ""; Ox();}
function BkSpace() {Ix(); x = x.substring(0,x.length-1) ; Ox();}
function recip() {xEval(); x = 1/(x); Ox();}

function Xwork(s)  // --- finds how to handle incoming MENU (s)-values ---
 {if (s.indexOf('!')==0) {alert(s)} else  // '!' calls (s) to alert box
 {if (isNaN(s))
  {if (s.indexOf('x')>-1)       //-if expression is f(x), i.e.Method,
   {xEval(); x = eval(s); Oxf();}//  figure x, & substiture in function,  NOTE: Oxf()!!!!
  else {x += eval(s); Ox();} }  //-if a Property (eg. Math.PI), add value
 else {xPlusEq(s);}  }  }       //-if numeric constant, append like Jwork

function Im() {m = document.sCal.IOm.value;} // --- MEMORY fcns: like Ix() & Ox() ---
function Om() {document.sCal.IOm.value = m;}
function XtoM()  {Ix(); Im(); m+=x; Om(); x=""; Ox(); Timer=1;} //--with stopwatch settings
function MtoX()  {Ix(); Im(); x += m; Ox();}
function Mplus() {if (st0p>0){
  if (Timer==0) {Timer=1} else {Timer=0} m=st0p-0.00001; Om(); runStop(m*1000);}
 else {xEval(); if (m==""){m=0;} m = parseFloat(m) + parseFloat(x); Om(); x=""; Ox();}}
function Mclear() {m = ""; Om(); Timer=0; st0p=0;}

//function newWin(s) { } See regular version of sCal. Pocket PC doesn't do this well.

var Browser = navigator.appName.substr(0,9);
function EnterKey_EqButton(e) { // can use 'Enter' key (k=13) like [=] button
 var k=0;
 if (Browser=='Netscape') {k=e.which} else {k=window.event.keyCode;}
 if (k==13) {xEval();} } 
document.onkeypress = EnterKey_EqButton;

function runStop(k) {  // Timer functions
 start = new Date();
 start.setTime(start.getTime() - k);
 upDate();
 }
function upDate() {
 if (st0p>0){
  if (Timer==0) {
   now= new Date(); k=Mr((now.getTime()-start.getTime())/1000, 0);
   if (C>0) {m=C-k} else {m=k}
   st0p=m+0.00001; m+= ", "; Om();
   if (st0p<0) {st0p=0; m=0; Om(); x=temp; xRedo=1; Ox(); alert("Time Up!");}
   setTimeout("upDate();", 1000);}
 }}
//   ***** end of sCal in HEAD **** -->
</script>
