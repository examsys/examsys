var ShowXcmt = true;

function xAid() {

  ps= "By default, this Alert Box displays code-comments in \n";  // **JS** \n (linebreak)
  ps+="a more readible format than the x-Display--for lengthy \n";
  ps+="explanations or data tables.  [Format: '\\n' or '*_' makes \n";
  ps+="a line break, '\\t' is a tab.] \n ";
  ps+="* There are no comments in the x-code.";}
 else { // sort out comments-only for display
  ps ="Comments = \n\n";
  for (j=1; j<x.length; j++){   // **JS** stringName.length (means #ofChar)
   if (x.charAt(j-1)=='/' && (x.charAt(j)=='*' | x.charAt(j)=='/')) {AddTo=true}
   if (x.charAt(j+1)=='*'){     // **JS** stringName.charAt (Char#)
    if (x.charAt(j+2)=='/') {AddTo=false; ps+="\n";} // denotes end of comment
    if (x.charAt(j+2)=='_') {ps+="\n"}}
//   if (x.charAt(j+1)==';' && x.charAt(j+2)==' ') {ps+="\n"} // end of JScript line
   if (AddTo) {ps+=x.charAt(j+1)}
   }  //end for
  }  //end else
  ps+="\n\n[0K] or [Enter] to continue comments-only. \n";
  ps+="[Cancel] to display entire x-code.";
  if (confirm(ps)){ShowXcmt=true} else {ShowXcmt=false};   // **JS** confirm (dialog box)
 }  //end if (ShowXcmt) 
if (ShowXcmt==false){
 ps ="x-display = \n\n" +x.charAt(0);
 for (j=1;j<x.length;j++){
  ps+=x.charAt(j);
  if (x.charAt(j-1)==';' && x.charAt(j)==' '){ps+='\n'} } // line break at JS semi-colons
 ps+="\n\n[OK] or [Enter] continue showing entire x-display \n";
 ps+="[Cancel] show only comments in future";
 if (confirm(ps)) {ShowXcmt=false} else {ShowXcmt=true};}
}
