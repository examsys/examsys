                    evaluate the integral
                &lt;/p&gt;
                &lt;div class='mee nocomp'&gt;I=\oint_C f(z)dz \text{,}&lt;/div&gt;
                
                &lt;div class='mee nocomp'&gt;\sum_x^y \sin \theta&lt;/div&gt;
                
                &lt;p&gt;
                    where &lt;span class='mee'&gt;C&lt;/span&gt; is the contour &lt;span class='mee'&gt;\lvert z\rvert=5&lt;/span&gt;, mapped counter-clockwise.
                &lt;/p&gt;
            </textarea>
