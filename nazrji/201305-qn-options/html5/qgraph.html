<!DOCTYPE html>
<html>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Graph</title>
<style type="text/css">
#canvas_div {
	height: 600px;
	width: 800px;
	margin-top: 100px;
	margin-left: auto;
	margin-right: auto;
}
#canvas_graph  {
	border: thin solid #999;
}
</style>
</head>
<body>
<div id="canvas_div">
<canvas id="canvas_graph" width="800" height="600"></canvas><br>

<table  border="0">
  <tr>
    <td>x1:</td>
    <td>x2:</td>
    <td>y1:</td>
    <td>y2:</td>
  </tr>
  <tr>
    <td><input type='text' size='5' name='x1' id='x1'></td>
    <td><input type='text' size='5' name='x2' id='x2'></td>
    <td><input type='text' size='5' name='y1' id='y1'></td>
    <td><input type='text' size='5' name='y2' id='y2'></td>
  </tr>
  </table>
</div>

<script type='text/javascript'>
  var graph_x = 230;
  var graph_y = 50;
  var graph_w = 500;
  var graph_h = 500;
  var dragging = false;
  var redraw = true;
  var boundaries = new Array(20,50,30,60);
  var active_line = 0;
  
  //creating data
  var graph_data = new Array();
  var graph_metadata = new Array();
  graph_data[0] = 100*Math.random();
  graph_metadata.push(0);
  graph_data[99] = Math.abs(100-Math.abs(50-graph_data[0]));//100*Math.random();
  graph_metadata.push(99);
  
  for (var i=0;i<20;i++) {
    graph_metadata.sort(function(a,b){return a-b});
    //console.log(graph_metadata);
    mdl = graph_metadata.length-1;
    for (var j=0;j<mdl;j++) {
      dx=graph_metadata[j+1]-graph_metadata[j];
      dy=graph_data[graph_metadata[j+1]]-graph_data[graph_metadata[j]];
      dz=Math.round(graph_metadata[j]+dx/2);
      if (graph_metadata.indexOf(dz)==-1) {
        graph_metadata.push(dz);       
        graph_data[dz] = 1.2*dy*Math.random()+graph_data[graph_metadata[j]];
        if (graph_data[dz]<0) graph_data[dz] = 1;
        if (graph_data[dz]>99) graph_data[dz] = 99;
      }
    }
  }
  function smooth() {
    for (var i=0;i<100-2;i++) {
      var d1 = graph_data[i+1] - graph_data[i];
      var d2 = graph_data[i+2] - graph_data[i];
      var d3 = (d1+d2/2)/2;
      graph_data[i+1] = graph_data[i]+d3;
    }
  }
  smooth();
  smooth();
	//end of data creation
  
  
  canvas = document.getElementById('canvas_graph');

	if (canvas && canvas.getContext){
		canvas.onmouseup     = g_mouseDragUp;
		canvas.onmousedown = g_mouseDragDown;
		canvas.onmousemove = g_mouseDragMove;
    var intervalID = window.setInterval(g_redraw_canvas, 10);
	}
	
	if (canvas && !canvas.getContext){
		alert ('Canvas not supported');
	}
  
	if (canvas && canvas.getContext){
		context = canvas.getContext('2d');
	}
  
  function drawLine(ctx,cc,xx,yy,ww,hh) {
    ctx.strokeStyle = cc;
    ctx.beginPath();
    ctx.moveTo(xx-0.5,yy-0.5);
    ctx.lineTo(xx+ww-0.5,yy+hh-0.5);
    ctx.stroke();
  }
  
  function drawArrow(ctx,cc,xx,yy,rr) {
    ctx.strokeStyle = cc;
    ctx.fillStyle = cc;
    var pp= 0.4;
    var tt= 10;
    var x1 = 1*(xx)+Math.cos(rr)*tt/2+pp;
    var y1 = 1*(yy)+Math.sin(rr)*tt/2+pp;
    var x2 = Math.round(x1+Math.cos(rr-Math.PI+pp)*tt); 
    var y2 = Math.round(y1+Math.sin(rr-Math.PI+pp)*tt);
    var x3 = Math.round(x1+Math.cos(rr-Math.PI-pp)*tt); 
    var y3 = Math.round(y1+Math.sin(rr-Math.PI-pp)*tt);
    ctx.lineJoin = "Miter"; //sharp edges
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.lineTo(x3,y3);
    ctx.lineTo(x1,y1);
    ctx.fill();
    ctx.stroke();
    //ctx.lineJoin = "Round"; //...back again
  }
    
  function g_redraw_canvas() {
    function act(line_nr) {
      if (line_nr==active_line) {
        context.shadowColor = '#F88';
        context.shadowBlur = 5;
      } else {
        context.shadowColor = 'white';
        context.shadowBlur = 0;
      }
    }
    
    function dimmed_labels(tt,tx,ty) {
      var cc = 0;
      if ((x1-tx)<60) cc=Math.round(256-236*(x1-tx)/60);
      if ((x2-tx)<60) cc=Math.round(256-236*(x2-tx)/60);
      if (cc>256) cc=256;
      context.fillStyle = 'rgb('+cc+','+cc+','+cc+')';
      context.fillText(tt,tx,ty);
    }
    
    if (dragging || redraw) {
      //console.log('redrawing');
      context.clearRect(0,0,canvas.width,canvas.height);
      context.shadowColor = 'white';
      context.shadowBlur = 0;
      //drawing a graph  
      context.lineWidth = 1;
      drawLine(context,'#000',graph_x,canvas.height-graph_y,0,-graph_h);
      drawLine(context,'#000',graph_x,canvas.height-graph_y,graph_w,0);
      drawArrow(context,'#000',graph_x+graph_w,canvas.height-graph_y,0);
      drawArrow(context,'#000',graph_x,canvas.height-graph_y-graph_h,-Math.PI/2);

      var ty = canvas.height-graph_y-5*graph_data[0];
      context.moveTo(graph_x,ty);
      
      for (var i=0;i<100;i++) {
        ty=canvas.height-graph_y-5*graph_data[i];
        context.lineTo(graph_x+i*5,ty);
      }
      context.stroke();
      
      //displaying data 
      var x1 = graph_x+graph_w/100*boundaries[0];
      var x2 = graph_x+graph_w/100*boundaries[1];
      var y3 = canvas.height-graph_y-graph_h/100*boundaries[2];
      var y4 = canvas.height-graph_y-graph_h/100*boundaries[3];
      
      //outside labels
      context.font="13px Arial";
      context.textAlign="left";
      context.fillText('x1 = '+Math.round(boundaries[0]*10)/10+'%',50,200);      
      context.fillText('x2 = '+Math.round(boundaries[1]*10)/10+'%',50,220);      
      context.fillText('y1 = '+Math.round(boundaries[2]*10)/10+'%',50,240);      
      context.fillText('y2 = '+Math.round(boundaries[3]*10)/10+'%',50,260);      
      
      //textboxes outside canvas
      document.getElementById('x1').value = Math.round(boundaries[0]*10)/10+'%';
      document.getElementById('x2').value = Math.round(boundaries[1]*10)/10+'%';
      document.getElementById('y1').value = Math.round(boundaries[2]*10)/10+'%';
      document.getElementById('y2').value = Math.round(boundaries[3]*10)/10+'%';

                 
      //standing labels
      context.font="11px Arial";
      context.textAlign="right";
      x0 = graph_x+graph_w;
      if ((x0-x1)<60) x0 = x1+60;
      if ((x0-x2)<60) x0 = x2+60;
      context.fillText('100%',x0,canvas.height-graph_y+20);
      var y0 = canvas.height-graph_y-graph_h+10;
      if ((y3-y0)<20) y0 = y3-20;
      if ((y4-y0)<20) y0 = y4-20;
      context.fillText('100%',graph_x-10,y0);
      y0 = canvas.height-graph_y;
      if ((y0-y3)<20) y0 = y3+20;
      if ((y0-y4)<20) y0 = y4+20;
      context.fillText('0%',graph_x-10,y0);
      context.textAlign="left";
      var x0 = graph_x;
      y0 = canvas.height-graph_y+20;
      var y5 =y0;
      if ((y5-y3)<30) y5 = y3+30;
      if ((y5-y4)<30) y5 = y4+30;
      if ((x1-x0)<40) {x0 = x1-40;y0 = y5}
      if ((x2-x0)<40) {x0 = x2-40;y0 = y5}
      context.fillText('0%',x0,y0);      

      //moving labels
      context.font="13px Arial";
      context.fillStyle = '#000';
      context.textAlign="center";
      var divert = 0;
      if (Math.abs(x1-x2)<50) divert = (50-Math.abs(x1-x2))/2;
      if (divert > 15) divert = 15;
      context.fillText(Math.round(boundaries[0]*10)/10+'%',x1,canvas.height-graph_y+25);
      context.fillText(Math.round(boundaries[1]*10)/10+'%',x2,canvas.height-graph_y+25+divert);
      context.textAlign="right";
      divert = 0;
      if (Math.abs(y3-y4)<25) divert = -4*(25-Math.abs(y3-y4));
      if (divert < -40) divert = -40;
      context.fillText(Math.round(boundaries[2]*10)/10+'%',graph_x-15,y3+5);
      context.fillText(Math.round(boundaries[3]*10)/10+'%',graph_x-15+divert,y4+5);      
      
      //drawing boundaries
      var gap = 5;
      act(1);
      drawLine(context,'#900',x1,canvas.height-graph_y-gap,0,-graph_h+2*gap);      
      act(2);
      drawLine(context,'#900',x2,canvas.height-graph_y-gap,0,-graph_h+2*gap);      
      act(3);
      drawLine(context,'#900',graph_x+gap,y3,graph_w-2*gap,0);
      act(4);
      drawLine(context,'#900',graph_x+gap,y4,graph_w-2*gap,0);

    }
    redraw = false;
  }
  
  function g_mouseDragUp(e) {
    dragging = false;
  }
  
  function g_mouseDragDown(e) {
    dragging = true;
  }
  
  function g_mouseDragMove(e) {
    rect = canvas.getBoundingClientRect();
    loc_lft = rect.left;
    loc_top = rect.top;
    var xm = e.clientX;
    var ym = e.clientY;
    //var xm = e.pageX;
    //var ym = e.pageY;
    x = xm - loc_lft;
    y = ym - loc_top;   

    if (dragging) {
      if (active_line==1 || active_line==2) boundaries[active_line-1] = (x-graph_x)/graph_w*100;
      if (active_line==3 || active_line==4) boundaries[active_line-1] = 100-(y-graph_y)/graph_h*100;
      if (boundaries[active_line-1]>100) boundaries[active_line-1] = 100;
      if (boundaries[active_line-1]<0) boundaries[active_line-1] = 0;
      
      //swap active lines if dragging over
      if (boundaries[1]<boundaries[0]) {
        boundaries[1] = [boundaries[0], boundaries[0] = boundaries[1]][0];
        active_line = 3 - active_line;
      } 
      if (boundaries[3]<boundaries[2]) {
        boundaries[3] = [boundaries[2], boundaries[2] = boundaries[3]][0];
        active_line = 7 - active_line;
      }       
      if (active_line>-1) g_redraw_canvas;
    } else {
      var old_active_line = active_line;
      active_line = 0;
      var treshold = 3
      if (Math.abs(graph_x+graph_w/100*boundaries[0]-x)<treshold) active_line = 1;
      if (Math.abs(graph_x+graph_w/100*boundaries[1]-x)<treshold) active_line = 2;
      if (Math.abs(canvas.height-graph_y-graph_h/100*boundaries[2]-y)<treshold) active_line = 3;
      if (Math.abs(canvas.height-graph_y-graph_h/100*boundaries[3]-y)<treshold) active_line = 4;
      
      var cur = 'default';
      if (active_line>0) cur = 'col-resize';
      if (active_line>2) cur = 'row-resize';
      e.target.style.cursor = cur;
      
      if (active_line!=old_active_line) {
        redraw = true;    
        g_redraw_canvas;
      }
    }
  }   
</script>
</body>
</html>
