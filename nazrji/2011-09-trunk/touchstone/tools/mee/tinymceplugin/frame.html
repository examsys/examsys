<HTML>
	<HEAD>
		<meta http-equiv="x-ua-compatible" content="IE=9">
		<META NAME="GENERATOR" Content="Microsoft Visual Studio .NET 7.1">
	    <script src="../../../mee/jquery/jquery-1.6.1.js"></script>
        <script>
            var mee_baseurl = "../../../mee/";
        </script>
	    <script src="../../../mee/js/mee_src.js"></script>
       <TITLE></TITLE>
	</HEAD>
    <style>html {overflow: hidden;}</style>
	<BODY style="margin: 0px; padding: 0px">
        <div id='equation'></div>
	</BODY>
    <script>
        var no_auto_mee = 1;
        var data = window.location.search;
        var data = data.substr(1);
        data = unescape(data);
        var data = $.parseJSON(data);
        $('#equation').css('font-size', data.fontsize);
        if (data.inline) {
            tag = $("<span>");
        } else {
            tag = $("<div>");
        }
        tag.attr('id', 'eqn_inner');
        tag.addClass('mee');
        tag.html(data.latex);
        $('#equation').append(tag);

        $().ready(function () {
            setupFrame();
        });

        $('#equation').click(function () {
            if (window.parent && window.parent.parent && window.parent.parent.clickMEEiFrame)
                window.parent.parent.clickMEEiFrame(window);
        });
        function setupFrame() {
            if (typeof MEE == "undefined") {
                setTimeout("setupFrame()", 500);
                return;
            }
            if ($('#eqn_inner').attr('title'))
                return;

            //console.log("Iframe Render");
            var meeeqn = new MEE.Display($('#eqn_inner')[0], data.inline);
            meeeqn.Align();
            if (data.inline)
                $('#equation').css('padding-top', $('#eqn_inner').css('padding-top'));

            if (window.parent && window.parent.parent && window.parent.parent.updateMEE)
                window.parent.parent.updateMEE(window, meeeqn.elementset.align, data.inline);
        }
    </script>
</HTML>
