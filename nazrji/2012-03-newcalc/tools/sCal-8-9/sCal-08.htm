<SCRIPT LANGUAGE="JavaScript">
//
// sCal small, scientific, script (programmable) Calculator ver.0.8r
// -----------------------------------------------------------------
// entered into the Public Domain: R. Mohaupt, April, 2004 - see below
//
// --- CSS, 'Style' above controls NORMAL format of this version.---
// Different browsers or systems may display better with refinements.
//  -delete "Set...", "Display...", filler lines for VerySM format.-
//
// size t1 body|buttons-b| 1-cell, b1 |2-cell|d1-drops|x-displaly
//       width |font-size|width height| w  h |   w  h |  w   h
// ------ -----    ----    ----  ----  -- --   --- --   --- --
// VerySM 128px|    8px  | 16px  13px |33 13 |  86 12 | 124 50
//  SMALL 200px|   12px  | 29px  20px |62 20 | 132 20 | 195 64
// NORMAL 240px|   15px  | 35px  24px |75 24 | 158 24 | 235 72
//  LARGE 300px|   17px  | 42px  30px |90 30 | 200 30 | 295 90 etc.
//
// Code & Comments are condensed for economy in printout. r.m 4-04

var ps = "";  // ps is a temp. for 3 alert functions below: - READ -
function About_sCal() { 
  ps= "sCal vers.0.8 - Small, Scientific, Script Calculator \n\n";
 ps+= "Free, Public Domain, accessable JavaScript code. \n";
 ps+= "User must inspect code and test known values \n";
 ps+= "before critical use.  - - NO WARRANTEES. - -\n\n";
 ps+= "R.Mohaupt: Apr, 2004 - mgineer1@netscape.net \n\n";
 ps+= "'Script' & 'Calculator' links produce alert boxes \n";
 ps+= "similar to this--like 'Quick Reference Cards'. 'Help' \n";
 ps+= "links to sCal8-Doc.htm file, if in same directory. \n";
 alert(ps); }

function About_Script() {
  ps= "sCal is written in JavaScript (JS) & HTML.  This has\n";
 ps+= "* bad and, depending on outlook,  * good points: \n";
 ps+= "* interpreted vs. compiled code  * can view/modify \n";
 ps+= " -browser->view, source, text-edit, save, refresh \n";
 ps+= " -follow examples to add user functions/converts \n" 
 ps+= " -(if inclined: change color, rearange buttons, etc) \n";
 ps+= "* limited capabilities   * 'safe' from system damage \n";
 ps+= "* incompatibilities  * Web makes JS near universal \n";
 ps+= " -OK in MsIE5/6, Netscape6/Mozilla, Opera7-not 6 \n\n";
 ps+= "See source code examples & comments--especially \n";
 ps+= "in sCal2.  Use 'Find' function of Editor.  Much Text \n";
 ps+= "and Web documentation available to obtain full \n";
 ps+= "power of programming in sCal's framework: syntax \n";
 ps+= "similar to C++ or Java =worthwhile learning effort. \n\n";
 ps+= "Notes: - - - * NaN (Not a Number), 'Error on Page', \n";
 ps+= " or no response, can often be edited through.\n";
 ps+= "* May copy/paste to/from text files and x-display. \n";
 ps+= "* The eval() function does all the work: parsing \n";
 ps+= " expressions, setting precidence (*,/ before +,-) \n\n";
 ps+= "* Compact display and file size are goals of sCal. \n";
 ps+= " Cascading 'Style' set/edit format at top of code.";
 alert(ps); }

function About_Calc() {
  ps= "Simple Calculator operated by button [0]...[9] keys \n";
 ps+= "or from keyboard, with [*] [/] [+] [-] or others as \n";
 ps+= "expected. [<] deletes last entry.  Usually easier to \n";
 ps+= "edit from keyboard.  Click [=] or press [Enter] (as \n";
 ps+= "long as cursor is in the x-display area) to evaluate \n";
 ps+= "expression in the x-display.  Only one-[x^] power \n";
 ps+= "key allowed in any expression.  Math.pow(x,y) is \n";
 ps+= "the more flexible JavaScript method. Use [JS] key. \n\n";
 ps+= "[x>m] [m>x] [m+] [mc] move x-display into, out \n";
 ps+= "of, add in, & clear the memory, m-display. -*- In \n";
 ps+= "Stopwatch mode (Select in catagory 2) these work\n";
 ps+= "[stop] [lap] [pause/start] [reset].\n\n";
 ps+= "   Upper, drop-down Select boxes are pre-coded \n";
 ps+= "with Conversions, Mathematic Functions, & micro- \n";
 ps+= "programs.  (In theory, very elaborate programs \n";
 ps+= "(JScrAps) can be created (see sCal2), problem is \n";
 ps+= "organizing input/output.)  View these [ ]as extra, \n";
 ps+= "changeable key caps with invocation options: [Do] \n";
 ps+= "applies the function, [JS] writes the expression \n";
 ps+= "in the x-display for further coding. Alphabetic\n";
 ps+= "characters or /*comment: prompt*/'_'; are often \n";
 ps+= "used to clarify the expected number _ entry. \n\n";
 ps+= "EXPERIMENT - - not randomly, but with a point. ";
 alert(ps); }

var x = "";  // by Javascript loose typing, 'x' is a string, AND/OR number: confuses '+' if adding
var m = "";  // stores Memory.  Note: x & m are GLOBAL--of concern if sCal embedded.
var xRedo=0; // restores current x
var Timer=0; var st0p=0; // for stopwatch
var TAPE=""; // for virtual adding machine tape

function Ix() {x = document.sCal.IOx.value;} // Update x-string since can change from keyboard

function Ox() {document.sCal.IOx.value = x;} // Output x-string change to display

function Mr(val,place) {var d=Math.pow(10,place); // set output decimal places
 return Math.round(d*val)/d;}

function xEval() {Ix();    // JavaScript eval allows multi-statements, see examples.
 xTemp=x;
 var n = x.indexOf('^');
 if (n > 0) {
  if (x.indexOf('^',n+1) > 0) {alert("WARNING! Only 1 [^] allowed in expression!");}
  else {  // all to left of '^' is taken as base, and all right as exponent
  document.sCal.IOx.value = Math.pow(eval(x.substring(0,n)),eval(x.substring(n+1)));}
  }       // likewise, entire x-value is used as function argument, not just last term
 else {document.sCal.IOx.value = eval(x);}
 if (xRedo==1) {x=xTemp; Ox(); Om(); xRedo=0;}
 Ix(); }

function xPlusEq(s) {Ix(); x += s; Ox();} // --- DISPLAY-x functions ---
function xMultEq(s) {xEval(); x *= s; Ox();}
function Clear() {x = ""; Ox();}
function BkSpace() {Ix(); x = x.substring(0,x.length-1) ; Ox();}
function recip() {xEval(); x = 1/(x); Ox();}

function Xwork(s)  // --- finds how to handle incoming MENU (s)-values ---
 {if (s.indexOf('!')==0) {alert(s)} else  // '!' calls (s) to alert box
 {if (isNaN(s))
  {if (s.indexOf('x')>-1)       //-if expression is f(x), i.e.Method,
   {xEval(); x = eval(s); Ox();}// figure x, & substiture in function
  else {x += eval(s); Ox();} }  //-if a Property (eg. Math.PI), add value
 else {xPlusEq(s);}  }  }       //-if numeric constant, append like Jwork

function Im() {m = document.sCal.IOm.value;} // --- MEMORY fcns: like Ix() & Ox() ---
function Om() {document.sCal.IOm.value = m;}
function XtoM()  {Ix(); Im(); m+=x; Om(); x=""; Ox(); Timer=1;} //--with stopwatch settings
function MtoX()  {Ix(); Im(); x += m; Ox();}
function Mplus() {if (st0p>0){
  if (Timer==0) {Timer=1} else {Timer=0} m=st0p-0.00001; Om(); runStop(m*1000);}
 else {xEval(); if (m==""){m=0;} m = parseFloat(m) + parseFloat(x); Om(); x=""; Ox();}}
function Mclear() {m = ""; Om(); Timer=0; st0p=0;}

function newWin(s) {               // Creates a browser window to SHOW & SAVE data: s;
 dta2 = open();                    // Variable results in IE, Netscape/Mozilla, & Opera;
 dta2.document.open('text/html');  // Generally view -> Source Code; or Cut-Paste to .txt file;
 dta2.document.writeln('<html><body>');
 dta2.document.writeln(s);
 dta2.document.writeln('<br><br>');
// dta2.document.writeln('<a href="#" onClick="history.back()">.Back.</a>');
 dta2.document.writeln('______________.<br><small>close [x] to return</small>');
 dta2.document.writeln('</body></html>');
 dta2.document.close() }

var Browser = navigator.appName.substr(0,9);
function EnterKey_EqButton(e) { // can use 'Enter' key (k=13) like [=] button
 var k=0;
 if (Browser=='Netscape') {k=e.which} else {k=window.event.keyCode;}
 if (k==13) {xEval();} } 
document.onkeypress = EnterKey_EqButton;

function runStop(k) {  // Timer functions
 start = new Date();
 start.setTime(start.getTime() - k);
 upDate();
 }
function upDate() {
 if (st0p>0){
  if (Timer==0) {
   now= new Date(); k=Mr((now.getTime()-start.getTime())/1000, 2);
   if (C>0) {m=C-k} else {m=k}
   st0p=m+0.00001; m+= ", "; Om();
   if (st0p<0) {st0p=0; m=0; Om(); x=temp; xRedo=1; Ox(); alert("Time Up!");}
   setTimeout("upDate();", 10);}
 }}

//   ********** end of sCal in HEAD ******* -->
</script>
